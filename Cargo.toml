[package]
name = "whisper-talk"
version = "0.1.0"
edition = "2021"
authors = ["Aljaz Ceru <aljaz@disobey.dev>"]
description = "System-wide voice dictation for Linux with Whisper and Parakeet backends"
repository = "https://github.com/aljazceru/whisper-talk"
license = "MIT"
readme = "README.md"
keywords = ["voice", "dictation", "whisper", "speech-recognition", "wayland"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
futures-util = { version = "0.3.31", default-features = false, features = ["alloc"] }

[dependencies.cpal]
version = "0.17"
features = []

[dependencies.rubato]
version = "0.16"

[dependencies.rodio]
version = "0.20"
default-features = false
features = ["vorbis"]

[dependencies.whisper-rs]
version = "0.15"
default-features = false

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["blocking", "rustls-tls"]

[dependencies.tokio]
version = "1.43"
features = ["rt-multi-thread", "sync", "time", "signal", "macros"]

[dependencies.evdev]
version = "0.13"

[dependencies.nix]
version = "0.29"
features = ["fs", "ioctl"]

[dependencies.libc]
version = "0.2"

[dependencies.udev]
version = "0.9"

[dependencies.zbus]
version = "5.13"
default-features = false
features = ["tokio"]

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.serde_json]
version = "1.0"

[dependencies.directories]
version = "6.0"

[dependencies.dirs]
version = "6.0"

[dependencies.clap]
version = "4.5"
features = ["derive", "cargo", "env", "string"]

[dependencies.tracing]
version = "0.1"

[dependencies.tracing-subscriber]
version = "0.3"
default-features = false
features = ["fmt", "env-filter", "ansi"]

[dependencies.indicatif]
version = "0.17"

[dependencies.dialoguer]
version = "0.11"

[dependencies.gtk4]
version = "0.9"
optional = true

[dependencies.gtk4-layer-shell]
version = "0.4"
optional = true

[dependencies.anyhow]
version = "1.0"

[dependencies.thiserror]
version = "2.0"

[dependencies.parking_lot]
version = "0.12"

[dependencies.once_cell]
version = "1.20"

[dependencies.regex]
version = "1.11"

[dependencies.notify-rust]
version = "4.11"
optional = true

[dev-dependencies]
rstest = "0.24"
mockall = "0.13"
tempfile = "3.16"

[features]
default = []
mic-osd = ["gtk4", "gtk4-layer-shell"]
notifications = ["notify-rust"]
# GPU acceleration features
cuda = ["whisper-rs/cuda"]
hipblas = ["whisper-rs/hipblas"]
vulkan = ["whisper-rs/vulkan"]
metal = ["whisper-rs/metal"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
