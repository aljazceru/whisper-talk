[package]
name = "whisper-talk"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
authors = ["Aljaz Ceru <aljaz@disobey.dev>"]
description = "System-wide voice dictation for Linux with Whisper and Parakeet backends"
repository = "https://github.com/aljazceru/whisper-talk"
license = "MIT"
readme = "README.md"
keywords = ["voice", "dictation", "whisper", "speech-recognition", "wayland"]
categories = ["command-line-utilities", "multimedia::audio"]
exclude = ["/target_check"]

[dependencies]
futures-util = { version = "0.3.31", default-features = false, features = ["alloc"] }

[dependencies.axum]
version = "0.8"
features = ["multipart"]

[dependencies.cpal]
version = "0.18"
features = []

[dependencies.hound]
version = "3.5"

[dependencies.symphonia]
version = "0.6"
features = ["all-formats", "all-codecs"]

[dependencies.rubato]
version = "5.0"

[dependencies.rodio]
version = "0.23"
default-features = false
features = ["playback", "vorbis"]

[dependencies.whisper-rs]
version = "0.16"
default-features = false

[dependencies.parakeet-rs]
version = "0.3.7"
default-features = false

[dependencies.ort]
version = "2.0.0-rc.13"
default-features = false
features = ["std", "ndarray", "rocm", "load-dynamic", "api-20", "tracing"]

[dependencies.reqwest]
version = "0.13"
default-features = false
features = ["blocking", "rustls"]

[dependencies.tokio]
version = "1.43"
features = ["rt-multi-thread", "sync", "time", "signal", "macros"]

[dependencies.evdev]
version = "0.13"

[dependencies.libc]
version = "0.2"

[dependencies.udev]
version = "0.9"

[dependencies.zbus]
version = "5.13"
default-features = false
features = ["tokio"]

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.serde_json]
version = "1.0"

[dependencies.directories]
version = "6.0"

[dependencies.dirs]
version = "6.0"

[dependencies.clap]
version = "4.5"
features = ["derive", "cargo", "env", "string"]

[dependencies.tracing]
version = "0.1"

[dependencies.tracing-subscriber]
version = "0.3"
default-features = false
features = ["fmt", "env-filter", "ansi"]

[dependencies.indicatif]
version = "0.18"

[dependencies.dialoguer]
version = "0.12"

[dependencies.notify-rust]
version = "4.18"
optional = true

[dependencies.anyhow]
version = "1.0"

[dependencies.thiserror]
version = "2.0"

[dependencies.gtk]
version = "0.11"
package = "gtk4"
optional = true
features = ["v4_10"] # gtk::accessible (update_property) is gated on v4_10

[dependencies.ksni]
version = "0.3"
optional = true

[dependencies.parking_lot]
version = "0.12"

[dependencies.once_cell]
version = "1.20"

[dependencies.regex]
version = "1.11"

[dependencies.tempfile]
version = "3.27"

[patch.crates-io]
parakeet-rs = { path = "vendor/parakeet-rs" }

[features]
default = []
gui = ["dep:gtk", "dep:ksni"]
notifications = ["notify-rust"]
# GPU acceleration features
cuda = ["whisper-rs/cuda", "ort/cuda"]
hipblas = ["whisper-rs/hipblas"]
vulkan = ["whisper-rs/vulkan"]
metal = ["whisper-rs/metal"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
